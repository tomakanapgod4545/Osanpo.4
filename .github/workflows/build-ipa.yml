      - name: Multiplayer settings (edit url and key here)
        run: |
          cat > www/config.js <<'CFG_EOF'
          // Supabase 接続設定（公開用キーのみ。service_role / secret キーは絶対にここへ書かないこと）
          window.MP_CONFIG = {
            url: "https://sfatiwevlvzmiulbxoio.supabase.co",
            key: "sb_publishable_12tkxmmnTQjzp-OHoXwIKg_LrW-ySOQ"
          };
          CFG_EOF
      - run: npm install
      - name: Copy libraries into the app
        run: |
          cp node_modules/three/build/three.min.js www/three.min.js
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/supabase.js
      - run: npx cap add ios
      - name: Landscape only / hide status bar
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarHidden bool true" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool false" $PLIST || true
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" $PLIST
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationLandscapeLeft" $PLIST
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeRight" $PLIST
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" $PLIST || true
      - run: npx cap sync ios
      - name: Build unsigned archive
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$PWD/build/App.xcarchive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/App.xcarchive/Products/Applications/App.app Payload/
          zip -qry shiawase-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: shiawase-ipa
          path: shiawase-unsigned.ipa
